  <title>剑妈 · kind 色块分层稿</title>
  <desc>原彩图同坐标 941×1672。8 类标记色；闭合可编辑贝塞尔底形，透明背景，无描边。保留实际开口与各类前后遮挡，补全头形、颈胸、肩臂、骨盆与后发。 第二候选局部返修：连续耳坠及中空链环、两侧胸前鬓发、趾端外缘。</desc>
  <g data-kind="hair" fill="#359CDC" stroke="none" fill-rule="evenodd" ns1:groupmode="layer" ns1:label="头发 · 后部长发完整底形" id="hair-back">
    </g>
  <g data-kind="hair" fill="#359CDC" stroke="none" fill-rule="evenodd" ns1:groupmode="layer" ns1:label="头发 · 盘发" id="hair-updo">
    </g>
