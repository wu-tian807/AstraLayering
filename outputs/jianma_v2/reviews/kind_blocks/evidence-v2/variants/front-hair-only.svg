<svg xmlns="http://www.w3.org/2000/svg" xmlns:ns1="http://www.inkscape.org/namespaces/inkscape" width="941" height="1672" viewBox="0 0 941 1672" version="1.1">
  <title>剑妈 · kind 色块分层稿</title>
  <desc>原彩图同坐标 941×1672。8 类标记色；闭合可编辑贝塞尔底形，透明背景，无描边。保留实际开口与各类前后遮挡，补全头形、颈胸、肩臂、骨盆与后发。 第二候选局部返修：连续耳坠及中空链环、两侧胸前鬓发、趾端外缘。</desc>
