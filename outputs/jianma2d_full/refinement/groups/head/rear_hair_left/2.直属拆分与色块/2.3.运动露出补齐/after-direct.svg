    <desc>后脑固定发根同面补全：脸、前发、侧发及颈部遮挡大部分帽状面；正常头部转动时耳后窄面可露出。原root向x443/y336及neck向x327–414/y381连续延伸，已涵盖当前耳后至颈后完整接头；只变形同面，不另造后片、不把耳侧背景孔填掉。</desc></g><g id="part-head-rear-hair-left-central-back-tail" data-part-path="head/rear_hair_left/central_back_tail" fill="#7B8BC7" stroke="none"><path id="head-rear-hair-left-central-back-tail-tail" d="M 425 812 C 425 856 432 884 432 919 C 431 974 429 1033 437 1081 C 442 1122 432 1184 432 1218 C 432 1250 438 1284 441 1310 C 444 1289 451 1251 451 1217 C 451 1181 445 1120 445 1082 C 451 1034 448 976 450 930 C 451 885 452 850 457 813 Z" stroke="none" />
    <desc>中央后尾束同面补全：身体、骨盆与双腿遮住y812–1218的根段，末端在腿间露出。正常轻摆由上段宽32px发根接到hidden内面，保留完整812–1310连续形体与单尖；受运动驱动弯曲时连接仍在身体后方，不需独立后片或扩大父范围。</desc></g></svg>