<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="895" height="1758" viewBox="0 0 895 1758"><g id="head_rear_hair_left_occipital_root" data-part-path="head/rear_hair_left/occipital_root" clip-path="url(#head_rear_hair_left_occipital_root_ear_opening)"><desc>后脑固定发根；完整帽状面与颈后扇面为同一银灰头发表面。位于脸、颈、前发、侧发、耳饰之前景后方。仅耳后真实开口透明；上下遮挡连接不裁掉。</desc><defs><clipPath id="head_rear_hair_left_occipital_root_ear_opening" clipPathUnits="userSpaceOnUse">
        <path id="head_rear_hair_left_occipital_root_ear_opening_geometry" d="M 0 0 H 895 V 1758 H 0 Z M 352.2 302.7 C 351.7 310 349.0 319.5 346.0 332.8 C 344.1 330.3 343.4 325.4 345.5 318.2 C 347.6 311.5 350.2 306.6 352.2 302.7 Z" clip-rule="evenodd" />
      </clipPath>
    </defs><g id="head_rear_hair_left_occipital_root_surfaces"><path id="head_rear_hair_left_occipital_root_surface_0" d="M 371 264 C 369 243 378 221 397 207 C 412 195 430 196 441 208 L 443 336 C 421 355 390 365 365 362 L 355 348 C 364 317 373 290 371 264 Z" fill-rule="nonzero" fill="#F5F5F5" stroke="none"><desc>所属head/rear_hair_left/occipital_root；完整批准闭合填色面；隐藏连接继续同一发流，闭合边本身不全部作为最终硬描边。</desc></path><path id="head_rear_hair_left_occipital_root_surface_1" d="M 371 262 C 362 281 354 309 347 333 L 327 381 L 357 379 C 380 375 402 367 411 353 L 414 308 C 397 295 385 278 371 262 Z M 358 284 C 350 301 342 317 343 330 C 343 334 344 337 345 340 C 350 321 355 302 358 284 Z" fill-rule="evenodd" fill="#F5F5F5" stroke="none"><desc>所属head/rear_hair_left/occipital_root；完整批准闭合填色面；隐藏连接继续同一发流，闭合边本身不全部作为最终硬描边。</desc></path></g><g id="head_rear_hair_left_occipital_root_geometry" fill="none"><path id="head_rear_hair_left_occipital_root_source_outer_contact" data-role="contour" data-final="visible" d="M 371 262 C 362 281 354 309 347 333 L 327 381" fill="none" stroke="#777A87" stroke-width="0.8" opacity="0.8" stroke-linecap="round"><desc>head/rear_hair_left/occipital_root：耳后上端(371,262)沿现有外缘下行至(327,381)，与内幕接头在下端淡出；上端藏在前发下，中央细而清楚，末端留白，不描成断开的发帽。 对应上方闭合表面。</desc></path><path id="head_rear_hair_left_occipital_root_source_ear_opening" data-role="contour" data-final="visible" d="M 352.2 302.7 C 351.7 310 349 319.5 346 332.8 C 344.1 330.3 343.4 325.4 345.5 318.2 C 347.6 311.5 350.2 306.6 352.2 302.7" fill="none" stroke="#777A87" stroke-width="0.65" opacity="0.8" stroke-linecap="round"><desc>head/rear_hair_left/occipital_root：耳后透明细孔完整环缘；起止同在(352.2,302.7)，两端尖细，近下弯略实，背景孔不可封死；线后仍保持透明。 对应上方闭合表面。</desc></path><path id="head_rear_hair_left_occipital_root_source_hidden_cap" data-role="contour" data-final="omit-hidden" d="M 371 264 C 369 243 378 221 397 207 C 412 195 430 196 441 208 L 443 336 C 421 355 390 365 365 362 L 355 348 C 364 317 373 290 371 264 Z" fill="none" stroke="#777A87" stroke-width="0.5" opacity="0.3" stroke-linecap="round"><desc>head/rear_hair_left/occipital_root：完整帽状面自(371,264)经后脑顶(397,207)至(441,208)，右侧接(443,336)；目前遮在脸、前发与颈后，仅几何参考，最终隐藏轮廓不形成假接缝。 对应上方闭合表面。</desc></path><path id="head_rear_hair_left_occipital_root_source_root_groove" data-role="structure" data-final="visible" d="M 397 215 C 383 239 377 263 373 291 C 371 318 363 344 351 373" fill="none" stroke="#878B9E" stroke-width="0.65" opacity="0.75"><desc>所属head/rear_hair_left/occipital_root。后脑隐根(397,215)顺耳后发流下接(351,373)，主发束浅沟，y285–355稍实、上下收细淡入；是同发面凹槽，不分割part，不加硬闭合边。</desc></path><path id="head_rear_hair_left_occipital_root_source_neck_fan" data-role="structure" data-final="visible" d="M 413 217 C 399 243 391 276 389 308 C 389 334 385 355 379 372" fill="none" stroke="#878B9E" stroke-width="0.5" opacity="0.75"><desc>所属head/rear_hair_left/occipital_root。内侧帽面(413,217)经(389,308)接颈后(379,372)，宽发面顺流转向；头部遮挡内规律延续，耳后露出段细且软，中段轻显、端部留白，不描成两块硬贴片。</desc></path><path id="head_rear_hair_left_occipital_root_source_silver_ridge" data-role="tone-boundary" data-tone-type="self-light" data-final="tone-only" d="M 389 227 C 377 262 368 298 355 356" fill="none" stroke="#829DB3" stroke-width="0.5" stroke-dasharray="none" opacity="0.8"><desc>head/rear_hair_left/occipital_root：后脑发面左侧偏前受光，从隐根(389,227)顺发流至(355,356)；右侧延伸约10–16px形成窄银灰亮带，软边6–9px；色面/高光接管，最后不描线。</desc></path><path id="head_rear_hair_left_occipital_root_source_inner_turn" data-role="tone-boundary" data-tone-type="self-shadow" data-final="tone-only" d="M 418 229 C 402 267 399 310 391 366" fill="none" stroke="#829DB3" stroke-width="0.5" stroke-dasharray="none" opacity="0.8"><desc>head/rear_hair_left/occipital_root：后脑朝颈内侧右方回暗，曲线右侧至批准root/neck右缘闭合；自身蓝灰转面，软边约10px，帽状隐面按相同光向延续，色面接管。</desc></path><path id="head_rear_hair_left_occipital_root_source_jaw_cast_limit" data-role="tone-boundary" data-tone-type="external-shadow" data-final="tone-only" d="M 378 278 C 388 298 400 312 416 321 C 418 337 407 356 393 369" fill="none" stroke="#A6A0B5" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.8"><desc>head/rear_hair_left/occipital_root：脸/下颌遮光投到occipital_root，右侧与头颈遮挡下的原闭合面围成投影范围，接触端较硬1–2px、离开后软3–5px；随head/face而动，非自身转面，后续独立层，当前仅定位。</desc></path></g></g><g id="head_rear_hair_left_central_back_tail" data-part-path="head/rear_hair_left/central_back_tail"><desc>中央独立后尾束；从身体后方(425–457,812)连续至腿间(441,1310)的单尖；位于躯干、骨盆、双腿之后，不切成当前露出碎片。</desc><defs /><g id="head_rear_hair_left_central_back_tail_surfaces"><path id="head_rear_hair_left_central_back_tail_surface_0" d="M 425 812 C 425 856 432 884 432 919 C 431 974 429 1033 437 1081 C 442 1122 432 1184 432 1218 C 432 1250 438 1284 441 1310 C 444 1289 451 1251 451 1217 C 451 1181 445 1120 445 1082 C 451 1034 448 976 450 930 C 451 885 452 850 457 813 Z" fill-rule="nonzero" fill="#F5F5F5" stroke="none"><desc>所属head/rear_hair_left/central_back_tail；完整批准闭合填色面；隐藏连接继续同一发流，闭合边本身不全部作为最终硬描边。</desc></path></g><g id="head_rear_hair_left_central_back_tail_geometry" fill="none"><path id="head_rear_hair_left_central_back_tail_source_tail_left" data-role="contour" data-final="visible" d="M 425 812 C 425 856 432 884 432 919 C 431 974 429 1033 437 1081 C 442 1122 432 1184 432 1218 C 432 1250 438 1284 441 1310" fill="none" stroke="#777A87" stroke-width="0.75" opacity="0.8" stroke-linecap="round"><desc>head/rear_hair_left/central_back_tail：由(425,812)隐藏根部沿左缘经过腰膝间窄段到(441,1310)单尖；上根起笔淡，长边细稳，末尖强制渐尖；腿遮挡位置不截断同一条线。 对应上方闭合表面。</desc></path><path id="head_rear_hair_left_central_back_tail_source_tail_right" data-role="contour" data-final="visible" d="M 441 1310 C 444 1289 451 1251 451 1217 C 451 1181 445 1120 445 1082 C 451 1034 448 976 450 930 C 451 885 452 850 457 813" fill="none" stroke="#777A87" stroke-width="0.7" opacity="0.8" stroke-linecap="round"><desc>head/rear_hair_left/central_back_tail：从(441,1310)收尖沿右缘回到(457,813)身体后；尖部起笔轻，束中略实，上端被身体覆盖处淡出；闭合填色通过隐藏上口完成，成稿不画水平封口线。 对应上方闭合表面。</desc></path><path id="head_rear_hair_left_central_back_tail_source_axial_flow" data-role="structure" data-final="guide-only" d="M 439 823 C 437 881 441 920 440 969 C 439 1011 439 1056 441 1085 C 443 1122 439 1180 441 1220 C 442 1257 442 1288 441 1306" fill="none" stroke="#878B9E" stroke-width="0.4" opacity="0.75"><desc>所属head/rear_hair_left/central_back_tail。中央尾束轴向转面，从隐藏上根(439,823)沿腰膝收窄弯曲至末尖(441,1306)；参考是一条连续单束，没有额外劈叉，作为体积走向参考，成稿不保留贯穿的黑色中线。</desc></path><path id="head_rear_hair_left_central_back_tail_source_tail_light" data-role="tone-boundary" data-tone-type="self-light" data-final="tone-only" d="M 433 827 C 433 877 438 928 437 981 C 436 1030 440 1070 441 1090 C 442 1126 437 1184 439 1224 C 440 1261 441 1290 441 1306" fill="none" stroke="#829DB3" stroke-width="0.5" stroke-dasharray="none" opacity="0.8"><desc>head/rear_hair_left/central_back_tail：细尾束左侧银灰反射脊，左缘至此曲线为较亮窄面，沿束宽收放，过渡2–4px；膝间与尖端变窄，自身亮面完整延续，不画硬中线。</desc></path><path id="head_rear_hair_left_central_back_tail_source_left_leg_cast" data-role="tone-boundary" data-tone-type="external-shadow" data-final="tone-only" d="M 427 835 C 428 893 435 938 434 984 C 433 1036 440 1075 440 1096" fill="none" stroke="#A6A0B5" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.8"><desc>head/rear_hair_left/central_back_tail：左腿/大腿内侧遮光在central_back_tail的左边窄带，近左轮廓1–3px偏暗，朝中央2px渐隐；上根与腿遮挡部分保留连续投影，follow legs/left_leg，独立投影层接管。</desc></path><path id="head_rear_hair_left_central_back_tail_source_right_leg_cast" data-role="tone-boundary" data-tone-type="external-shadow" data-final="tone-only" d="M 453 835 C 448 890 445 944 447 984 C 445 1036 442 1077 443 1096" fill="none" stroke="#A6A0B5" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.8"><desc>head/rear_hair_left/central_back_tail：右腿内侧在中央尾束右侧形成较浅灰蓝遮光，向中央2px软化；follow legs/right_leg，顶端/膝间渐退，色面接管不留黑线。</desc></path></g></g></svg>