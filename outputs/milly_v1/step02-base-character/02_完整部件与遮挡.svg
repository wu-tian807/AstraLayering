    <title>右侧发与右侧顶发</title><desc>补齐发根与发夹下中段；鬓发的内缘自然遮住右侧脸，外翻发梢保留完整。</desc>
    <path id="hair-right-shape" d="M506 56 C522 45 552 57 571 75 C593 96 605 123 617 149 C629 177 643 196 650 215 C656 232 650 245 643 251 C650 231 643 210 631 190 C638 213 645 237 641 254 C638 268 632 274 625 277 C630 270 634 257 634 247 C630 264 620 276 610 280 C615 272 619 264 621 255 C610 268 599 273 588 270 C599 268 605 262 608 254 C597 263 586 260 580 253 C573 253 569 249 567 244 C562 250 558 252 552 254 C564 243 572 229 575 212 C580 184 575 155 566 133 C552 101 531 76 518 71 C513 68 509 70 506 73 Z"/>
