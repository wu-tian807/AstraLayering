  <g id="ear-left" data-part="ear-left" data-role="body" fill="#e7be94">
    <title>左耳完整底形</title><desc>依头部体积推断简化耳廓，组合时全部藏在侧发与脸底形后。</desc>
    <path id="ear-left-shape" d="M437 207 C426 198 421 207 424 220 C426 232 431 241 439 239 C445 232 444 215 437 207 Z"/>
  </g>
