    <title>右手掌与前侧拇指</title><desc>掌根补入腕部，拇指内缘与后侧手指之间保留自然空隙。</desc>
    <path id="hand-right-main-shape" d="M694 717 C699 736 711 760 720 778 L719 813 C716 821 710 829 704 837 L699 844 C695 848 692 842 696 836 L703 823 C706 817 708 813 708 810 L704 792 C701 787 696 783 693 779 C693 790 697 801 696 807 C695 812 691 815 689 810 C684 802 683 797 680 788 C676 778 670 772 668 760 C665 748 670 739 665 724 Z"/>
