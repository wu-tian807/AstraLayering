  <g id="head-face" data-part="head-face" data-role="body" fill="#ffebc7">
    <title>头脸完整底形</title><desc>额头、太阳穴和发下侧脸补成完整闭合头形；可见脸缘逐段依基础彩图校准。本阶段不画五官。</desc>
