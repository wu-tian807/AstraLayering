  <title>完整部件与遮挡 — 橙发基础角色</title>
  <desc>原图同坐标1024×1536；不透明纯色结构分组。所有隐藏底形保存在闭合路径中，绘制顺序由后至前；左右均为画面左右。</desc>
  <g id="hair-back" data-part="hair-back" data-role="hair" fill="#63b847">
    <title>后发完整发体</title>
    <desc>补齐头脸后的整片发体与发下中段，颈旁发梢保持原图轮廓；上端由侧发与刘海自然覆盖。</desc>
