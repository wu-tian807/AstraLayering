    <title>右耳完整底形</title><desc>依头部体积推断简化耳廓，组合时全部藏在侧发与脸底形后。</desc>
    <path id="ear-right-shape" d="M572 207 C583 198 589 206 586 220 C584 232 579 242 572 239 C566 232 565 215 572 207 Z"/>
