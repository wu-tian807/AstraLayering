  <g id="bodysuit" data-part="bodysuit" data-role="clothing" fill="#66baf0">
    <title>基础连体服</title><desc>单一闭合衣片含双肩带与领口，遮盖连续躯干和腿根；不画衣缘线、侧缝或内部衣褶，可整件隐藏。</desc>
