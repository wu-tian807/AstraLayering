  </g>
  <g id="body-core" data-part="body-core" data-role="body" fill="#bd86ed">
    <title>颈部、躯干与骨盆连续底形</title><desc>下巴后颈顶、肩胸与衣下腰胯连续补全；骨盆跨过腿根搭接，不使用裤脚曲线作人体外缘。腿根和肩根位于躯干上层，裆底留在原图实际轮廓内。</desc>
    <path id="body-core-shape" d="M481 274 C480 291 481 316 477 324 C468 332 444 339 425 341 C418 349 414 365 415 386 C416 406 412 429 416 454 C419 484 431 516 436 539 C442 562 428 585 416 611 C403 637 394 663 390 688 C386 711 393 728 414 739 C438 748 473 750 505 751 C539 750 575 748 599 739 C620 728 627 711 623 688 C619 663 610 637 597 611 C585 585 571 562 577 539 C582 516 594 484 597 454 C601 429 597 406 598 386 C599 365 595 349 587 341 C568 339 544 332 535 324 C530 316 532 291 531 274 Z"/>
  </g>
