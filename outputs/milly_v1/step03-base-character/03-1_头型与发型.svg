<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" id="character-structure" data-stage="line-art-head">
  <title>头型与发型线稿 — 橙发基础角色</title>
  <desc>同坐标1024×1536。头脸、发型与双发夹为不透明白底和所属深色墨线；其他部件沿用阶段2显示。闭合完整底形先于墨线，隐藏的自然轮廓保留，人为发根封口不描线；左右均指画面左右。</desc>
