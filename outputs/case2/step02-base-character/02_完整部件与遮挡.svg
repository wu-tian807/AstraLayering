  <g id="body-torso-neck" data-part="body-torso" data-category="body" fill="#ffd5ba">
    <title>颈部、完整躯干与骨盆</title>
    <desc>颈部从下颌内延伸，躯干经胸腰连续到骨盆；衣下只补必要体块，无乳头、生殖器或隐藏解剖细节。高叉衣缘不作为身体边界，左右腿根在骨盆内搭接。</desc>
