  <title id="document-title">02 完整部件与遮挡</title>
  <desc id="document-desc">1024×1536。按实际内容以7adeb8b17f5a99b2eab6f13bc069cc44.png校准轮廓，以cea21a3eb54f2c9b235fdbb07756a07c.png组织分区；阶段1仅用于检查遗漏。左右指画面左右。各绘制组按后到前排列，隐藏补全保存在闭合实心路径中。纯色为结构检查色，无五官、线稿、阴影或位图。data-part关联同一逻辑部件，data-category仅是可读分类，绘制不依赖脚本。</desc>
  <g id="hair-ahoge" data-part="hair-ahoge" data-category="hair" fill="#8944df">
    <title>顶部翘发</title>
    <desc>翘发根完整延伸至顶发下；内弧是实际翘发与背景的开口。</desc>
