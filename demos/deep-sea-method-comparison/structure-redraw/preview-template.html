<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深海少女 · 手写贝塞尔重绘</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#222b33;background:#eef1f3;font-size:13px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:1px solid #d8e0e5;background:white;border-radius:7px;padding:8px 11px;cursor:pointer;color:inherit}button:hover{border-color:#499acd;background:#f2f9fd}button.active,.primary{background:#20394a;color:white;border-color:#20394a}header{height:73px;background:#fff;border-bottom:1px solid #dae2e7;padding:0 28px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;letter-spacing:.04em;margin:0 0 5px;font-weight:620}.muted{color:#73828c;font-size:12px}.header-right{display:flex;align-items:center;gap:20px}.badge{display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#49a9df}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100vh - 73px)}main{display:flex;flex-direction:column;min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px}.modes{display:flex;gap:6px}.stage{flex:1;min-height:0;overflow:auto;padding:5px 24px 22px;display:flex;align-items:flex-start;justify-content:center}.sheet{position:relative;flex-shrink:0;width:auto;height:100%;aspect-ratio:2/3;box-shadow:0 3px 24px #233e4b12;background:#fefefe}.sheet.checker{background:repeating-conic-gradient(#e7ecef 0% 25%,#fff 0% 50%) 0 0/18px 18px}.sheet>svg{width:100%;height:100%;display:block}.reference{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:none;pointer-events:none}.stage-foot{padding:0 24px 14px;display:flex;justify-content:space-between;gap:8px;color:#7c8b95;font-size:11px}aside{background:#fff;border-left:1px solid #dae2e7;display:flex;flex-direction:column;overflow:hidden}.section{padding:20px;border-bottom:1px solid #e8edef}.label{font-size:11px;letter-spacing:.09em;color:#778b98;margin-bottom:11px}.section h2{font-size:15px;font-weight:600;margin:0 0 14px}.play-row{display:flex;gap:6px;margin-bottom:12px}#play{flex:1}#seek{width:100%;accent-color:#369bd6;margin:8px 0 10px}.step-stats{display:flex;justify-content:space-between;font-size:11px;color:#778b98}.phase-row{display:flex;gap:6px;margin-top:13px}.phase-row button{flex:1;font-size:11px;padding:7px 4px}.status{margin-top:12px;line-height:1.6;min-height:39px;font-size:12px;color:#607989}.layer-top{padding:16px 20px 12px}.layer-top .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#search{border:1px solid #dce4e9;border-radius:7px;width:100%;padding:9px 11px;outline:none}#search:focus{border-color:#469dd0}.layers{flex:1;min-height:70px;overflow:auto;padding:0 10px 10px}.layer{display:flex;gap:8px;align-items:center;min-height:37px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12px}.layer:hover{background:#f1f6f9}.layer.selected{background:#e7f3fb;color:#22638d}.layer input{accent-color:#348cc0}.layer .rank{font-size:10px;color:#8497a4;width:20px}.layer .name{flex:1}.layer .swatch{width:9px;height:9px;border-radius:3px;border:1px solid #0001}.palette{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 8px}.palette span{width:18px;height:18px;border-radius:4px;border:1px solid #0001}.selection{border-top:1px solid #e8edef;padding:15px 20px}.selection-title{font-size:12px;font-weight:600}.selection .muted{font-size:10px;line-height:1.7}.inline-btn{font-size:11px;padding:5px 8px}.help{font-size:11px;line-height:1.75;color:#83929b;margin:10px 0 0}.zoom{display:flex;gap:5px;align-items:center}.zoom select{border:1px solid #d8e0e5;padding:7px;background:#fff;border-radius:7px;color:#617581}.file-link{color:#286f99;text-decoration:none;font-size:12px}.file-link:hover{text-decoration:underline}@media(max-width:780px){header{padding:0 16px}.header-right .badge{display:none}.workspace{grid-template-columns:minmax(0,1fr) 258px}.toolbar{padding:10px;flex-wrap:wrap}.section{padding:15px}.stage{padding:0 8px 12px}.modes button{padding:7px}.stage-foot{display:none}}@media(max-width:560px){.workspace{height:auto;display:flex;flex-direction:column}main{height:74vh}aside{height:660px;border-left:0}.header-right{display:none}.sheet{height:100%}}
</style>
<style>main,aside{min-height:0}.stage{flex:1 1 0;height:0}.sheet{min-width:0;min-height:0}</style>
<header><div><h1>深海少女</h1><div class="muted">手写曲线 · 平涂临摹 · 独立部件</div></div><div class="header-right"><span class="badge"><i class="dot"></i>手写 SVG</span><span class="muted" id="totals"></span><a class="file-link" href="手绘线稿.png" target="_blank">查看线稿 ↗</a><a class="file-link" href="深海少女_手绘分层.svg" download>下载 SVG ↗</a></div></header>
<div class="workspace">
<main><div class="toolbar"><div class="modes"><button class="active" data-view="art">SVG 成图</button><button data-view="source">原图</button><button data-view="overlay">叠加对照</button></div><div class="zoom"><button id="background" title="显示或隐藏 SVG 背景层">透明底</button><select id="zoom" aria-label="缩放"><option value="1">适合窗口</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></div></div><div class="stage"><div class="sheet" id="sheet">__ARTWORK__<img class="reference" id="reference" alt="用户提供的平涂参考图" src="__REFERENCE__"></div></div><div class="stage-foot"><span>1024 × 1536 · 原图坐标 · L/R 为画面左/右</span><span>SVG 内含完整路径建立与 fill 赋色记录</span></div></main>
<aside><div class="section"><div class="label">DRAWING PROCESS</div><h2>从路径到平涂</h2><div class="play-row"><button id="restart" title="回到第一步">↺</button><button class="primary" id="play">播放绘制过程</button><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></div><input id="seek" type="range" min="0" value="0" aria-label="绘制步骤"><div class="step-stats"><span id="phase"></span><span id="step"></span></div><div class="phase-row"><button id="to-start">建立路径</button><button id="to-fill">开始填色</button><button id="to-final">完整成图</button></div><div class="status" id="status"></div><p class="help">先依序建立手写曲线，再为闭合轮廓赋予 fill；结构线保留 stroke。没有自动描摹或分色轮廓拟合。</p></div>
<div class="layer-top"><div class="row"><span class="label" style="margin:0">独立图层 · 后 → 前</span><button class="inline-btn" id="all-layers">显示全部</button></div><input id="search" type="search" placeholder="搜索头发、裙、眼睛…" aria-label="搜索图层"></div><div class="layers" id="layers"></div><div class="selection"><div style="display:flex;justify-content:space-between;align-items:center"><span class="selection-title" id="selected-name">选择一个部件</span><button class="inline-btn" id="solo" disabled>独立查看</button></div><div class="palette" id="palette"></div><div class="muted" id="selected-meta">点击图层名称查看用色；勾选框控制显隐。</div></div></aside>
</div>
<script>
const svg=document.querySelector('#sheet>svg'), paths=[...svg.querySelectorAll('g>path')];
const data=JSON.parse(svg.querySelector('#layer-manifest').textContent).layers;
const record=JSON.parse(svg.querySelector('#drawing-sequence').textContent);
const groups=data.map(d=>svg.querySelector('#'+d.id)), n=paths.length, total=2*n;
const byId=Object.fromEntries(data.map(d=>[d.id,d]));
const seek=document.querySelector('#seek'), play=document.querySelector('#play');
let current=total, playing=false, lastTime=0, raf=0, selected=null, solo=false;
seek.max=total; document.querySelector('#totals').textContent=`${data.length} 图层 / ${n.toLocaleString()} 条路径`;
paths.forEach(p=>{p.dataset.fill=p.getAttribute('fill');p.dataset.ink=p.getAttribute('stroke')||'';p.dataset.inkWidth=p.getAttribute('stroke-width')||'1'});
function paint(index,step){const p=paths[index];if(step>=n+index+1){p.style.visibility='';p.setAttribute('fill',p.dataset.fill);if(p.dataset.ink){p.setAttribute('stroke',p.dataset.ink);p.setAttribute('stroke-width',p.dataset.inkWidth)}else{p.removeAttribute('stroke');p.removeAttribute('stroke-width')}}
else if(step>=index+1){p.style.visibility='';p.setAttribute('fill','none');p.setAttribute('stroke',p.dataset.ink||'#547d92');p.setAttribute('stroke-width',p.dataset.ink?p.dataset.inkWidth:'.75');p.setAttribute('stroke-linejoin','round')}
else{p.style.visibility='hidden';p.setAttribute('fill','none');p.removeAttribute('stroke')}}
function setStep(v){const old=Math.floor(current), next=Math.max(0,Math.min(total,Math.floor(v)));current=v;seek.value=next;
if(next===total||old===total||next<old){paths.forEach((p,i)=>paint(i,next))}else{for(let k=old+1;k<=next;k++){paint((k-1)%n,next)}}
const phase=next<n?'01 · 建立路径':next<total?'02 · 填充颜色':'完成';document.querySelector('#phase').textContent=phase;document.querySelector('#step').textContent=`${next.toLocaleString()} / ${total.toLocaleString()}`;
const event=record.events[Math.max(0,next-1)], d=event?byId[event.layer]:null;document.querySelector('#status').textContent=next===total?'全部部件已绘制并完成填色。':next===0?'准备从背景与后方部件开始建立路径。':`${d.name} · ${event.action==='draw-path'?'建立手写曲线':event.action==='retain-outline'?'保留结构线':'fill '+event.fill}`}
function pause(){playing=false;play.textContent='播放绘制过程';cancelAnimationFrame(raf)}
function tick(t){if(!playing)return;if(!lastTime)lastTime=t;let delta=(t-lastTime)/1000;lastTime=t;setStep(Math.min(total,current+delta*total/70*Number(document.querySelector('#speed').value)));if(current>=total){pause();return}raf=requestAnimationFrame(tick)}
play.onclick=()=>{if(playing){pause();return}setView('art');if(current>=total)setStep(0);playing=true;lastTime=0;play.textContent='暂停';raf=requestAnimationFrame(tick)};
seek.oninput=()=>{pause();setStep(Number(seek.value))};document.querySelector('#restart').onclick=()=>{pause();setStep(0);setView('art')};
document.querySelector('#to-start').onclick=()=>{pause();setStep(0);setView('art')};document.querySelector('#to-fill').onclick=()=>{pause();setStep(n);setView('art')};document.querySelector('#to-final').onclick=()=>{pause();setStep(total);setView('art')};
function setView(view){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const ref=document.querySelector('#reference');ref.style.display=view==='art'?'none':'block';ref.style.opacity=view==='overlay'?'.5':'1';svg.style.opacity=view==='source'?'0':'1'}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function selectLayer(d){selected=d;document.querySelectorAll('.layer').forEach(r=>r.classList.toggle('selected',r.dataset.id===d.id));document.querySelector('#selected-name').textContent=d.name;document.querySelector('#solo').disabled=false;
const ps=[...groups[d.rank].querySelectorAll('path')], cs=[...new Set(ps.map(p=>p.dataset.fill).filter(c=>c!=='none'))];document.querySelector('#palette').replaceChildren(...cs.map(c=>{const el=document.createElement('span');el.style.background=c;el.title=c;return el}));document.querySelector('#selected-meta').textContent=`${d.id} · ${ps.length} 条手写路径 · ${cs.length} 色`;if(solo)showSolo()}
function buildLayers(){const q=document.querySelector('#search').value.trim().toLowerCase();document.querySelector('#layers').replaceChildren(...data.filter(d=>`${d.name} ${d.category} ${d.id}`.toLowerCase().includes(q)).map(d=>{const row=document.createElement('div');row.className='layer'+(selected?.id===d.id?' selected':'');row.dataset.id=d.id;row.setAttribute('role','button');row.setAttribute('aria-label',d.name);row.tabIndex=0;row.onkeydown=e=>{if(e.key==='Enter')selectLayer(d)};const cb=document.createElement('input');cb.type='checkbox';cb.checked=groups[d.rank].style.display!=='none';cb.ariaLabel='显示'+d.name;cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{groups[d.rank].style.display=cb.checked?'':'none'};const rank=document.createElement('span');rank.className='rank';rank.textContent=String(d.rank+1).padStart(2,'0');const name=document.createElement('span');name.className='name';name.textContent=d.name;const sw=document.createElement('span');sw.className='swatch';sw.style.background=groups[d.rank].querySelector('path')?.dataset.fill||'#fff';row.append(cb,rank,name,sw);row.onclick=()=>selectLayer(d);return row}))}
document.querySelector('#search').oninput=buildLayers;
function showSolo(){groups.forEach((g,i)=>g.style.display=solo&&data[i].id!==selected.id?'none':'');document.querySelector('#sheet').classList.toggle('checker',solo);document.querySelector('#solo').textContent=solo?'退出独立查看':'独立查看';buildLayers()}
document.querySelector('#solo').onclick=()=>{pause();setStep(total);setView('art');solo=!solo;showSolo()};document.querySelector('#all-layers').onclick=()=>{solo=false;groups.forEach(g=>g.style.display='');document.querySelector('#solo').textContent='独立查看';document.querySelector('#sheet').classList.remove('checker');buildLayers()};
document.querySelector('#background').onclick=()=>{const g=groups[0],hide=g.style.display!=='none';g.style.display=hide?'none':'';document.querySelector('#sheet').classList.toggle('checker',hide);document.querySelector('#background').textContent=hide?'白色底':'透明底';buildLayers()};
function fitSheet(){const stage=document.querySelector('.stage'),sheet=document.querySelector('#sheet'),z=Number(document.querySelector('#zoom').value);const h=Math.min(stage.clientHeight-28,(stage.clientWidth-48)*1.5)*z;sheet.style.height=Math.max(120,h)+'px';sheet.style.width=Math.max(80,h/1.5)+'px'}
document.querySelector('#zoom').onchange=fitSheet;new ResizeObserver(fitSheet).observe(document.querySelector('.stage'));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();play.click()}});
setStep(total);buildLayers();fitSheet();
</script>
</html>
