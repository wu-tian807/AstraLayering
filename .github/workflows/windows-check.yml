name: Windows checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    name: Native Windows
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      ASTRA_TEST_REQUIRE_FILE_SYMLINK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
      - name: Verify Windows file symlink support
        run: |
          # Enable unprivileged symlinks only on this disposable CI machine.
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
          @'
          import { lstatSync, mkdtempSync, readFileSync, symlinkSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = mkdtempSync(join(process.env.RUNNER_TEMP, 'file-link-'));
          const source = join(directory, 'source'), link = join(directory, 'link');
          writeFileSync(source, 'native');
          symlinkSync(source, link, 'file');
          if (!lstatSync(link).isSymbolicLink() || readFileSync(link, 'utf8') !== 'native') throw Error('Windows file symlink probe failed');
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install dependencies
        run: |
          npm install --global pnpm@10.33.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Install native test tools
        run: |
          choco install ffmpeg --version=8.0.1 --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install krita --version=5.3.1 --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path $env:ChocolateyInstall 'bin'
          $ffmpeg = Join-Path $bin 'ffmpeg.exe'
          $krita = Join-Path $env:ProgramFiles 'Krita (x64)\bin\krita.exe'
          $python = (Get-Command python.exe -CommandType Application).Source
          foreach ($path in @($ffmpeg, $krita, $python)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing native test tool: $path" }
          }
          "ASTRA_STUDIO_FFMPEG=$ffmpeg" >> $env:GITHUB_ENV
          "ASTRA_TEST_KRITA=$krita" >> $env:GITHUB_ENV
          "ASTRA_TEST_PYTHON=$python" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
      - name: Check workflow types
        run: pnpm --dir .agents/skills/live2d-maker check
      - name: Check workbench types
        run: pnpm check:web
      - name: Test workflows
        timeout-minutes: 10
        run: pnpm --dir .agents/skills/live2d-maker test
      - name: Test workbench
        run: pnpm test:web
      - name: Test release packaging
        run: pnpm test:release
      - name: Test workbench launcher
        run: node --test scripts/start-workbench.test.mjs
